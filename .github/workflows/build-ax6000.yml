name: Build Redmi AX6000 Firmware

# ============================================================================
#  红米 AX6000（Xiaomi Redmi Router AX6000 / RB06，MT7986A）固件云编译
#  源码：chasey-dev/immortalwrt-mt798x-rebase（ImmortalWrt 25.12 + MTK OpenWrt Feeds 补丁）
#  特点：MTK 原厂闭源 WiFi 驱动 + HNAT/WARP 硬件加速 + eBPF/BTF 内核能力
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '源码仓库 (owner/repo)'
        required: true
        default: 'chasey-dev/immortalwrt-mt798x-rebase'
      source_ref:
        description: '源码分支 / 标签'
        required: true
        default: '25.12'
      profile:
        description: '设备 profile（必须和路由器当前的 U-Boot 布局一致）'
        type: choice
        options:
          - xiaomi_redmi-router-ax6000-mtkuboot
          - xiaomi_redmi-router-ax6000-ubootmod
          - xiaomi_redmi-router-ax6000-stock
        default: xiaomi_redmi-router-ax6000-mtkuboot
      make_jobs:
        description: '编译并行度（留空 = 自动使用 CPU 核数）'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ax6000.yml'
      - 'config/**'
      - 'scripts/**'
      - 'files/**'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  SOURCE_DIR: immortalwrt
  # ccache 目录由上游 rules.mk 固定在 $(TOPDIR)/.ccache，这里只限制它的大小，
  # 免得单个缓存条目撑爆 GitHub 仓库 10GB 的缓存配额（会挤掉 dl/ 缓存）
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    name: Build (${{ github.event.inputs.profile || 'xiaomi_redmi-router-ax6000-mtkuboot' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      # ------------------------------------------------------------------
      # 0. 释放磁盘空间：GitHub 免费 runner 只有 ~14GB 可用，
      #    OpenWrt 全量编译需要 25-35GB，这一步是必须的
      # ------------------------------------------------------------------
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: 显示可用空间
        run: df -h /

      # ------------------------------------------------------------------
      # 1. 检出本仓库（只放配置和脚本，不放源码）
      # ------------------------------------------------------------------
      - name: 检出编译器仓库
        uses: actions/checkout@v4
        with:
          path: builder

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex \
            g++ g++-multilib gawk gcc-multilib gettext git gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-docutils python3-pip python3-ply \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs unzip upx-ucl vim wget xmlto xxd zlib1g-dev zstd
          ccache --version

      # ------------------------------------------------------------------
      # 2. 克隆上游源码（浅克隆，只取一个分支）
      #
      #    ⚠️ 顺序很重要：这一步必须在「恢复 dl/ 与 .ccache 缓存」之前！
      #    缓存恢复会把 immortalwrt/ 目录提前创建出来，
      #    随后 git clone 会因「目标目录已存在且非空」直接 exit 128 失败。
      #    （第 2 次运行就是这么挂的，见 README 变更记录）
      # ------------------------------------------------------------------
      - name: 克隆源码 ${{ github.event.inputs.source_repo || 'chasey-dev/immortalwrt-mt798x-rebase' }}@${{ github.event.inputs.source_ref || '25.12' }}
        id: clone
        run: |
          SRC_REPO="${{ github.event.inputs.source_repo || 'chasey-dev/immortalwrt-mt798x-rebase' }}"
          SRC_REF="${{ github.event.inputs.source_ref || '25.12' }}"
          SRC_URL="https://github.com/${SRC_REPO}.git"

          # 清掉任何残留（含缓存步骤万一提前创建的目录）
          rm -rf "$SOURCE_DIR"

          ok=0
          for i in 1 2 3 4 5; do
            echo "==> 第 $i 次尝试（共 5 次）"
            rm -rf "$SOURCE_DIR"
            if git clone -q --depth=1 --single-branch --branch "$SRC_REF" "$SRC_URL" "$SOURCE_DIR"; then
              ok=1
              break
            fi
            echo "::warning::第 $i 次克隆失败，$((i*10))s 后重试"
            sleep $((i*10))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::源码克隆失败（已重试 5 次）：$SRC_URL @ $SRC_REF"
            exit 1
          fi

          cd "$SOURCE_DIR"
          # 预建目录，避免 actions/cache 报 "Path Validation Error"
          mkdir -p dl .ccache

          SHORT="$(git rev-parse --short HEAD)"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT_SHORT=$SHORT" >> "$GITHUB_ENV"
          echo "sha=$SHORT" >> "$GITHUB_OUTPUT"
          git log -1 --format='源码 commit: %H%n日期: %ci%n说明: %s'
          df -h /

      # ------------------------------------------------------------------
      # 3. 缓存（dl 源码包 + ccache）
      #
      #    ⚠️ 必须放在克隆之后：恢复缓存会创建 immortalwrt/ 目录，
      #    放在克隆前会让 git clone 以 exit 128 失败。
      #    ⚠️ ccache 目录是 $(TOPDIR)/.ccache，即 immortalwrt/.ccache
      #    （上游 rules.mk 第 354 行），不是 $HOME/.ccache ——
      #    路径写错会导致缓存永远是 0 字节。
      # ------------------------------------------------------------------
      - name: 缓存源码包 dl/
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: dl-${{ steps.clone.outputs.sha }}-${{ hashFiles('builder/config/ax6000-mtkuboot.config') }}
          restore-keys: |
            dl-${{ steps.clone.outputs.sha }}-
            dl-

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: immortalwrt/.ccache
          key: ccache-${{ steps.clone.outputs.sha }}-${{ github.run_number }}
          restore-keys: |
            ccache-${{ steps.clone.outputs.sha }}-
            ccache-

      # ------------------------------------------------------------------
      # 4. feeds
      # ------------------------------------------------------------------
      - name: 更新并安装 feeds
        run: |
          cd "$SOURCE_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 定制脚本 part1（feeds / 包调整）
        run: |
          chmod +x builder/scripts/*.sh
          cd "$SOURCE_DIR"
          bash ../builder/scripts/diy-part1.sh

      # ------------------------------------------------------------------
      # 5. 应用 .config 并校验 profile
      # ------------------------------------------------------------------
      - name: 应用配置并 defconfig
        id: config
        run: |
          cd "$SOURCE_DIR"
          PROFILE="${{ github.event.inputs.profile || 'xiaomi_redmi-router-ax6000-mtkuboot' }}"
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          cp ../builder/config/ax6000-mtkuboot.config .config

          # 若选择的不是默认 profile，则替换设备选项
          if [ "$PROFILE" != "xiaomi_redmi-router-ax6000-mtkuboot" ]; then
            sed -i \
              -e "s|^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-mtkuboot=y|# CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-mtkuboot is not set|" \
              -e "/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-mtkuboot=/d" \
              .config
            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${PROFILE}=y" >> .config
            echo "CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_${PROFILE}=\"\"" >> .config
          fi

          make defconfig

          # --- 关键校验：profile 必须真实存在，否则会白编 3 小时 ---
          if ! grep -q "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${PROFILE}=y" .config; then
            echo "::error::profile ${PROFILE} 在当前源码中不存在！"
            echo "---- 源码里实际提供的 AX6000 相关 profile ----"
            # 注意：-mtkuboot 定义在 filogic-ext.mk（不是 filogic.mk），两个都要查
            grep -rhoE 'DEVICE_xiaomi_redmi-router-ax6000[a-z0-9_-]*' \
                 target/linux/mediatek/image/filogic.mk \
                 target/linux/mediatek/image/filogic-ext.mk 2>/dev/null | sort -u || true
            echo "---- 源码里所有 xiaomi 设备 ----"
            grep -rhoE 'DEVICE_xiaomi_[a-z0-9_-]+' \
                 target/linux/mediatek/image/filogic.mk \
                 target/linux/mediatek/image/filogic-ext.mk 2>/dev/null | sort -u || true
            exit 1
          fi
          echo "✅ profile ${PROFILE} 已启用"

      # ------------------------------------------------------------------
      # 6. 定制脚本 part2（eBPF 内核选项注入等）+ 自定义文件覆盖层
      # ------------------------------------------------------------------
      - name: 定制脚本 part2（内核 eBPF / 品牌 / 文件覆盖层）
        run: |
          cd "$SOURCE_DIR"
          chmod +x ../builder/scripts/*.sh
          # 该脚本内部会：注入内核符号 → 加候选包 → make defconfig（两轮）
          #                → 回读 .config 自检 eBPF 开关，不通过直接 fail
          bash ../builder/scripts/diy-part2.sh
          if [ -d ../builder/files ]; then
            cp -rf ../builder/files/* .
          fi
          chmod +x files/etc/uci-defaults/* 2>/dev/null || true

      - name: 打印最终关键配置
        run: |
          cd "$SOURCE_DIR"
          PRE="../builder-precheck.txt"
          : > "$PRE"
          # 本地调试时该变量不存在，兜底到 /dev/null（Actions 里一定有值）
          : "${GITHUB_STEP_SUMMARY:=/dev/null}"

          log() { echo "$@" | tee -a "$PRE"; }

          log "===== 设备 / 镜像 ====="
          grep -E '^CONFIG_TARGET_(MULTI_PROFILE|PER_DEVICE_ROOTFS|ROOTFS_SQUASHFS)|^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_' .config | tee -a "$PRE" || true

          {
            echo "## 编译前配置核对"
            echo
            echo "| 项目 | 状态 |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          log ""
          log "===== 用户要求的组件（包名已按 25.12 全树核实）====="
          for p in smartdns luci-app-smartdns luci-i18n-smartdns-zh-cn \
                   luci-app-eqos-mtk luci-i18n-eqos-mtk-zh-cn \
                   luci-app-turboacc-mtk luci-app-mtwifi-cfg mtwifi-cfg-ucode \
                   kmod-mt_wifi kmod-warp kmod-mediatek_hnat \
                   kmod-sched-bpf kmod-xdp-sockets-diag bpftool-minimal libbpf1; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              log "  [y] $p"
              echo "| \`$p\` | 已启用 |" >> "$GITHUB_STEP_SUMMARY"
            else
              log "  [ ] $p  (未选中 / 包名不存在)"
              echo "| \`$p\` | 未启用 |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          log ""
          log "===== 内核 eBPF 开关（OpenWrt 侧）====="
          # 注意：DEBUG_INFO_REDUCED 期望是「未启用」，显示「未启用」即正确
          for s in DEBUG_INFO DEBUG_INFO_BTF DEBUG_INFO_REDUCED BPF_EVENTS CGROUP_BPF XDP_SOCKETS KPROBES KALLSYMS; do
            if grep -q "^CONFIG_KERNEL_${s}=y" .config; then
              log "  [y] CONFIG_KERNEL_${s}"
              echo "| \`KERNEL_${s}\` | 已启用 |" >> "$GITHUB_STEP_SUMMARY"
            else
              log "  [ ] CONFIG_KERNEL_${s}"
              echo "| \`KERNEL_${s}\` | 未启用 |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          log "  ---- pahole 工具（BTF 生成必需，由 KERNEL_DEBUG_INFO_BTF select）----"
          DWARVES_LINE="$(grep -E '^CONFIG_DWARVES=' .config || true)"
          log "  ${DWARVES_LINE:-（未在 .config 中显式出现，属正常）}"
          echo "| \`DWARVES\`(pahole) | ${DWARVES_LINE:-由 select 自动开启} |" >> "$GITHUB_STEP_SUMMARY"

          log ""
          log "===== 选中包总数 ====="
          grep -cE '^CONFIG_PACKAGE_.*=y' .config | tee -a "$PRE"

          log ""
          log "===== 注入到 target 内核 config 的符号 ====="
          tail -30 target/linux/mediatek/filogic/config-* | tee -a "$PRE"

          echo "PRECHECK_FILE=$PRE" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 7. 预下载 + 编译
      # ------------------------------------------------------------------
      - name: 预下载源码包
        run: |
          cd "$SOURCE_DIR"
          make -j8 download V=s || echo "::warning::部分源码包下载失败，编译阶段会自动重试"

      - name: 编译固件
        run: |
          cd "$SOURCE_DIR"
          JOBS="${{ github.event.inputs.make_jobs }}"
          if [ -z "$JOBS" ]; then JOBS="$(nproc)"; fi
          echo "并行度: $JOBS"
          date
          make -j"$JOBS"
          date

      - name: 编译失败时输出错误日志
        if: failure()
        run: |
          cd "$SOURCE_DIR" || true
          echo "===== logs/ 最近的日志文件 ====="
          ls -lt logs/ 2>/dev/null | head -20 || true
          echo "===== 报错片段 ====="
          grep -rn -i -E "error:|Error [0-9]+|\*\*\* \[" logs/ 2>/dev/null | tail -80 || true

      # ------------------------------------------------------------------
      # 8. 校验内核 eBPF 是否真的打开（.config 里写了不等于编译进内核）
      # ------------------------------------------------------------------
      - name: 校验内核 eBPF / BTF 实际状态
        run: |
          cd "$SOURCE_DIR"

          # 上一轮这里写的是 `ls build_dir/target-*/linux-*/.config`，
          # 少了一层 linux-<版本> 目录（内核 .config 在 $(LINUX_DIR)/.config），
          # 导致路径取空、校验静默失效并打印假告警。改用内容 + 多路径探测。
          if KCFG="$(bash ../builder/scripts/find-kernel-config.sh)"; then
            echo "内核配置文件: $KCFG"
          else
            echo "::error::未能定位内核 .config，无法校验 eBPF 是否真的编入"
            echo "---- build_dir 结构（前 3 层）----"
            find build_dir -maxdepth 3 -type d 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "KERNEL_CONFIG_FILE=$KCFG" >> "$GITHUB_ENV"

          echo "===== 内核里 eBPF / BTF 的真实状态 ====="
          grep -E '^#? ?CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_EVENTS|CGROUP_BPF|NET_CLS_BPF|NET_ACT_BPF|XDP_SOCKETS|XDP_SOCKETS_DIAG|DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_REDUCED|KPROBES|KPROBE_EVENTS|IKCONFIG)' "$KCFG" || true

          echo
          if grep -q '^CONFIG_DEBUG_INFO_BTF=y' "$KCFG"; then
            echo "✅ BTF 已编译进内核（eBPF CO-RE 可用）"
            echo "BTF_OK=yes" >> "$GITHUB_ENV"
            echo "- 内核 BTF：✅ 已生效" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::内核 .config 里没有 CONFIG_DEBUG_INFO_BTF=y —— eBPF CO-RE 不可用"
            echo "  排查顺序：① 内核 .config 里 DEBUG_INFO_REDUCED 是否被置回 y"
            echo "            ② CONFIG_DWARVES/pahole 是否可用"
            echo "BTF_OK=no" >> "$GITHUB_ENV"
            echo "- 内核 BTF：⚠️ 未生效（详见 kernel-config 产物）" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ------------------------------------------------------------------
      # 9. 整理产物 + 上传 + 发布 Release
      # ------------------------------------------------------------------
      - name: 整理产物
        id: prep
        run: |
          cd "$SOURCE_DIR"
          DATE="$(date +%Y%m%d)"
          OUT="../out/${DATE}-${SOURCE_COMMIT_SHORT}-${PROFILE}"
          mkdir -p "$OUT"
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.ubi' -o -name '*.fip' \
               -o -name 'sha256sums' -o -name 'profiles.json' -o -name '*.manifest' \) \
            -exec cp -v {} "$OUT/" \;

          # ---- 把「证据」一并导出，以后不需要读 Actions 日志 ----
          # 1) 内核 .config 全文：eBPF/BTF 是否真编入的最终证据
          KCFG="${KERNEL_CONFIG_FILE:-}"
          if [ -n "$KCFG" ] && [ -f "$KCFG" ]; then
            cp "$KCFG" "$OUT/kernel-config.txt"
          else
            echo "内核 .config 路径未知" > "$OUT/kernel-config.txt"
          fi
          # 2) 编译前的配置核对结果
          if [ -n "${PRECHECK_FILE:-}" ] && [ -f "$PRECHECK_FILE" ]; then
            cp "$PRECHECK_FILE" "$OUT/precheck.txt"
          fi

          # 先判定 BTF 结论（用于 Release 说明；不再硬编码宣称）
          BTF_NOTE="❓ 未能定位内核 .config，BTF 状态未知，请查看 kernel-config.txt"
          BTF_VERDICT="结论: ❓ 无法判定"
          if [ -n "$KCFG" ] && [ -f "$KCFG" ]; then
            if grep -q '^CONFIG_DEBUG_INFO_BTF=y' "$KCFG"; then
              BTF_NOTE="内核已启用 eBPF / BTF（CONFIG_DEBUG_INFO_BTF=y），CORE 程序可直接运行"
              BTF_VERDICT="结论: ✅ BTF 已编入内核，eBPF CO-RE 可用"
            else
              BTF_NOTE="⚠️ 本次内核**未**启用 BTF（CONFIG_DEBUG_INFO_BTF 未生效），eBPF CO-RE 不可用"
              BTF_VERDICT="结论: ❌ 内核缺少 CONFIG_DEBUG_INFO_BTF=y，eBPF CO-RE 不可用"
            fi
          fi

          {
            echo "构建时间    : $(date '+%F %T %Z')"
            echo "源码仓库    : ${{ github.event.inputs.source_repo || 'chasey-dev/immortalwrt-mt798x-rebase' }}"
            echo "源码分支    : ${{ github.event.inputs.source_ref || '25.12' }}"
            echo "源码 commit : ${SOURCE_COMMIT}"
            echo "设备 profile: ${PROFILE}"
            echo "内核 config : ${KCFG:-（未找到）}"
            echo
            echo "===== 内核 eBPF / BTF 实际状态（最终证据）====="
            if [ -n "$KCFG" ] && [ -f "$KCFG" ]; then
              grep -E '^#? ?CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_EVENTS|CGROUP_BPF|NET_CLS_BPF|NET_ACT_BPF|XDP_SOCKETS|XDP_SOCKETS_DIAG|DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_REDUCED|KPROBES|KPROBE_EVENTS|IKCONFIG)' "$KCFG" || true
            fi
            echo
            echo "$BTF_VERDICT"
            echo
            echo "===== 编译前配置核对（节选）====="
            if [ -n "${PRECHECK_FILE:-}" ] && [ -f "$PRECHECK_FILE" ]; then
              grep -E '^\[|^  \[y\]|^  \[ \]|^CONFIG_PACKAGE_|^CONFIG_KERNEL_|^  ----|^=====' "$PRECHECK_FILE" || cat "$PRECHECK_FILE"
            fi
            echo
            echo "===== 产物清单 ====="
            ls -lh "$OUT" | grep -v -- 'build-info.txt' || true
          } > "$OUT/build-info.txt"

          # 校验段最后追加，并排除 build-info.txt 自身
          # （原版把 sha256sum * 写在同一个 {} 里，导致 build-info.txt 的哈希
          #   是「写到一半」的状态，永远校验不通过）
          {
            echo
            echo "===== 完整性校验（不含 build-info.txt 自身）====="
            ( cd "$OUT" && find . -maxdepth 1 -type f ! -name 'build-info.txt' -printf '%f\n' \
                | sort | xargs sha256sum )
          } >> "$OUT/build-info.txt"

          cat "$OUT/build-info.txt"
          echo "OUT_DIR=$OUT" >> "$GITHUB_ENV"
          # 用 step 输出而不是 env，保证后续 with:/body: 里一定能取到值
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "tag=ax6000-${DATE}-${SOURCE_COMMIT_SHORT}" >> "$GITHUB_OUTPUT"
          echo "commit=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "commit_short=${SOURCE_COMMIT_SHORT}" >> "$GITHUB_OUTPUT"
          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"
          echo "source_repo=${{ github.event.inputs.source_repo || 'chasey-dev/immortalwrt-mt798x-rebase' }}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${{ github.event.inputs.source_ref || '25.12' }}" >> "$GITHUB_OUTPUT"
          echo "btf_note=${BTF_NOTE}" >> "$GITHUB_OUTPUT"
          du -sh "$OUT"

      - name: 上传固件为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax6000-${{ steps.prep.outputs.date }}-${{ steps.prep.outputs.profile }}
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "Redmi AX6000 ${{ steps.prep.outputs.date }} (${{ steps.prep.outputs.profile }})"
          files: out/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Redmi AX6000 自编译固件

            | 项目 | 内容 |
            | --- | --- |
            | 源码 | `${{ steps.prep.outputs.source_repo }}` @ `${{ steps.prep.outputs.source_ref }}` |
            | 源码 commit | `${{ steps.prep.outputs.commit }}` |
            | 设备 profile | `${{ steps.prep.outputs.profile }}` |
            | 构建时间 | `${{ steps.prep.outputs.date }}` |

            **内核状态**：${{ steps.prep.outputs.btf_note }}

            预装：MTK 原厂闭源 WiFi 驱动（kmod-mt_wifi 7.6.7.3）、HNAT/WARP 硬件加速、
            smartdns、eqos-mtk。

