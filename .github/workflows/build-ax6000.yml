name: Build Redmi AX6000 Firmware

# ============================================================================
#  红米 AX6000（Xiaomi Redmi Router AX6000 / RB06，MT7986A）固件云编译
#  源码：chasey-dev/immortalwrt-mt798x-rebase（ImmortalWrt 25.12 + MTK OpenWrt Feeds 补丁）
#  特点：MTK 原厂闭源 WiFi 驱动 + HNAT/WARP 硬件加速 + eBPF/BTF 内核能力
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '源码仓库 (owner/repo)'
        required: true
        default: 'chasey-dev/immortalwrt-mt798x-rebase'
      source_ref:
        description: '源码分支 / 标签'
        required: true
        default: '25.12'
      profile:
        description: '设备 profile（必须和路由器当前的 U-Boot 布局一致）'
        type: choice
        options:
          - xiaomi_redmi-router-ax6000-mtkuboot
          - xiaomi_redmi-router-ax6000-ubootmod
          - xiaomi_redmi-router-ax6000-stock
        default: xiaomi_redmi-router-ax6000-mtkuboot
      make_jobs:
        description: '编译并行度（留空 = 自动使用 CPU 核数）'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ax6000.yml'
      - 'config/**'
      - 'scripts/**'
      - 'files/**'

permissions:
  contents: write

# 防止连续两次推送并行跑两个 build：否则它们会往同一个 tag 发 Release、
# 同时读写 ccache、还抢 runner 额度（顺带省一次 1.6 小时的白编）。
# 新推送到了就让旧的那次取消，因为后推送的必然是最新意图。
concurrency:
  group: ax6000-build
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  SOURCE_DIR: immortalwrt
  # ccache 目录由上游 rules.mk 固定在 $(TOPDIR)/.ccache，这里只限制它的大小，
  # 免得单个缓存条目撑爆 GitHub 仓库 10GB 的缓存配额（会挤掉 dl/ 缓存）。
  # 上限从 2G 降到 1G：run 8/9 实测只用了约 560MB，省下的空间留给 dl/
  # （一份 1.8GB，必须保住，被 LRU 挤掉就要重下十几分钟）。
  CCACHE_MAXSIZE: 1G

jobs:
  build:
    name: Build (${{ github.event.inputs.profile || 'xiaomi_redmi-router-ax6000-mtkuboot' }})
    # runner 镜像说明（2026-10 定）：
    #   ① 不用 ubuntu-latest：该 label 会在 2026-10-19 ~ 11-19 之间跳到
    #      Ubuntu 26.04，届时是一次不受控的环境突变（工具链版本、apt 源都可能变）。
    #      明确写 ubuntu-24.04，让下次镜像变更成为一个需要主动决策的动作。
    #   ② 不用 ubuntu-22.04：该镜像 2026-09-17 已停止积极支持，deprecation 期间
    #      有「brownout」临时不可用窗口（24 小时级的偶发无 runner），
    #      2027-04-17 才完全移除。留着一个已知会随机抽风的镜像没有意义。
    #   ③ ubuntu-24.04 的 runner 版本 ≥ 2.327.1，满足 actions/*@v6（Node 24）
    #      的最低 runner 要求。
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      # ------------------------------------------------------------------
      # 0. 释放磁盘空间：GitHub 免费 runner 只有 ~14GB 可用，
      #    OpenWrt 全量编译需要 25-35GB，这一步是必须的
      #
      #    2026-10 改动：原来用第三方 action jlumbroso/free-disk-space，
      #    但该 action 已停止维护（2026-08 起无人维护，安全评分 F），
      #    且它 hardcode 了一批「预装大件」的路径，runner 镜像一换就可能漏删。
      #    改成内联 shell：只删我们确定用不到的东西，行为完全可控、可复现，
      #    也不用再担心它哪天被投毒或悄悄失效。
      #
      #    清理目标（按实测占用量从大到小）：
      #      /usr/share/dotnet        ~6GB   用不到
      #      /usr/local/lib/android   ~8GB   用不到
      #      /opt/ghc                 ~2GB   用不到
      #      /usr/local/share/boost   ~1GB   用不到
      #      /usr/share/swift         少量   用不到
      #      apt 缓存 + journal       ~1GB
      # ------------------------------------------------------------------
      - name: 释放磁盘空间
        run: |
          echo "===== 清理前 ====="
          df -h /
          # 只删目录、不碰系统包数据库；每条都允许失败（目录不存在是正常的）
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          # CodeQL 的预装工具链也很占地方，编译不需要
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          # apt 缓存与日志
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo journalctl --vacuum-size=50M 2>/dev/null || true
          echo "===== 清理后 ====="
          df -h /

      - name: 显示可用空间
        run: df -h /

      # ------------------------------------------------------------------
      # 1. 检出本仓库（只放配置和脚本，不放源码）
      # ------------------------------------------------------------------
      - name: 检出编译器仓库
        uses: actions/checkout@v6
        with:
          path: builder

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          # libgmp3-dev 在 24.04(noble) 里已变成「dummy package」，仅用于兼容，
          # 真实包名是 libgmp-dev。这里显式写 libgmp-dev，避免依赖 dummy 过渡包。
          # 其余包在 noble 均已核实存在（lib32gcc-s1 / libmpc-dev / libmpfr-dev /
          # libc6-dev-i386 / ecj / fastjar / mkisofs / msmtp / lrzsz 等）。
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex \
            g++ g++-multilib gawk gcc-multilib gettext git gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-docutils python3-pip python3-ply \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs unzip upx-ucl vim wget xmlto xxd zlib1g-dev zstd
          ccache --version

      # ------------------------------------------------------------------
      # 2. 克隆上游源码（浅克隆，只取一个分支）
      #
      #    ⚠️ 顺序很重要：这一步必须在「恢复 dl/ 与 .ccache 缓存」之前！
      #    缓存恢复会把 immortalwrt/ 目录提前创建出来，
      #    随后 git clone 会因「目标目录已存在且非空」直接 exit 128 失败。
      #    （第 2 次运行就是这么挂的，见 README 变更记录）
      # ------------------------------------------------------------------
      - name: 克隆源码 ${{ github.event.inputs.source_repo || 'chasey-dev/immortalwrt-mt798x-rebase' }}@${{ github.event.inputs.source_ref || '25.12' }}
        id: clone
        run: |
          SRC_REPO="${{ github.event.inputs.source_repo || 'chasey-dev/immortalwrt-mt798x-rebase' }}"
          SRC_REF="${{ github.event.inputs.source_ref || '25.12' }}"
          SRC_URL="https://github.com/${SRC_REPO}.git"

          # 清掉任何残留（含缓存步骤万一提前创建的目录）
          rm -rf "$SOURCE_DIR"

          ok=0
          for i in 1 2 3 4 5; do
            echo "==> 第 $i 次尝试（共 5 次）"
            rm -rf "$SOURCE_DIR"
            if git clone -q --depth=1 --single-branch --branch "$SRC_REF" "$SRC_URL" "$SOURCE_DIR"; then
              ok=1
              break
            fi
            echo "::warning::第 $i 次克隆失败，$((i*10))s 后重试"
            sleep $((i*10))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::源码克隆失败（已重试 5 次）：$SRC_URL @ $SRC_REF"
            exit 1
          fi

          cd "$SOURCE_DIR"
          # 预建目录，避免 actions/cache 报 "Path Validation Error"
          mkdir -p dl .ccache

          SHORT="$(git rev-parse --short HEAD)"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT_SHORT=$SHORT" >> "$GITHUB_ENV"
          echo "sha=$SHORT" >> "$GITHUB_OUTPUT"
          git log -1 --format='源码 commit: %H%n日期: %ci%n说明: %s'
          df -h /

      # ------------------------------------------------------------------
      # 3. 缓存（dl 源码包 + ccache）
      #
      #    ⚠️ 必须放在克隆之后：恢复缓存会创建 immortalwrt/ 目录，
      #    放在克隆前会让 git clone 以 exit 128 失败。
      #    ⚠️ ccache 目录是 $(TOPDIR)/.ccache，即 immortalwrt/.ccache
      #    （上游 rules.mk 第 354 行），不是 $HOME/.ccache ——
      #    路径写错会导致缓存永远是 0 字节。
      # ------------------------------------------------------------------
      #    ⚠️ key 里【不要】带 hashFiles(config)：dl/ 里只是源码包压缩包，
      #    跟 .config 一点关系都没有。带过的结果是 run 8 和 run 9 各存了一份
      #    1.8GB 的 dl 缓存（合计 3.6GB / 10GB 配额），再过两三次就会触发
      #    LRU，被挤掉的正好是最新那份 → 白下十几分钟。
      #    同理 ccache 也不要带 run_number —— 那是每次必然新增 0.56GB。
      #    这里改成「固定滚动 key」：命中就原地更新，永远只占一格。
      # ------------------------------------------------------------------
      - name: 缓存源码包 dl/
        uses: actions/cache@v6
        with:
          path: immortalwrt/dl
          # 只按上游源码 commit 区分：同一次源码，配置怎么改 dl 都一样
          key: dl-${{ steps.clone.outputs.sha }}
          # 上游 commit 变了但 dl 大部分相同，也能捞到相近的一份用
          restore-keys: |
            dl-
          # cache-mode 必须显式写：v5 起不指定时默认值取决于触发类型
          # （trusted→write / low-trust→read），依赖隐式默认不可靠。
          # 我们这里是 push 触发，但显式写 write 才不会哪天换了触发方式就静默不保存。
          cache-mode: write

      # 注意：ccache 用 cache/restore + cache/save 两步而不是单个 cache step。
      # 因为「固定 key + 单 step」在 restore 未命中时，cache@v4 的 post 步骤
      # 不会产出缓存（只有完整 key 命中才更新）。拆开后 miss 也能存下来。
      # v6 起 cache-mode 显式写，理由同上面 dl/ 那段。
      - name: 恢复 ccache（滚动 key）
        uses: actions/cache/restore@v6
        with:
          path: immortalwrt/.ccache
          key: ccache-${{ steps.clone.outputs.sha }}
          restore-keys: |
            ccache-
          cache-mode: read

      - name: 保存 ccache
        uses: actions/cache/save@v6
        with:
          path: immortalwrt/.ccache
          key: ccache-${{ steps.clone.outputs.sha }}
          cache-mode: write

      # ------------------------------------------------------------------
      # 4. feeds
      # ------------------------------------------------------------------
      - name: 更新并安装 feeds
        run: |
          cd "$SOURCE_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 定制脚本 part1（feeds / 包调整）
        run: |
          chmod +x builder/scripts/*.sh
          cd "$SOURCE_DIR"
          bash ../builder/scripts/diy-part1.sh

      # ------------------------------------------------------------------
      # 5. 应用 .config 并校验 profile
      # ------------------------------------------------------------------
      - name: 应用配置并 defconfig
        id: config
        run: |
          cd "$SOURCE_DIR"
          PROFILE="${{ github.event.inputs.profile || 'xiaomi_redmi-router-ax6000-mtkuboot' }}"
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          cp ../builder/config/ax6000-mtkuboot.config .config

          # 若选择的不是默认 profile，则替换设备选项
          if [ "$PROFILE" != "xiaomi_redmi-router-ax6000-mtkuboot" ]; then
            sed -i \
              -e "s|^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-mtkuboot=y|# CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-mtkuboot is not set|" \
              -e "/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-mtkuboot=/d" \
              .config
            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${PROFILE}=y" >> .config
            echo "CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_${PROFILE}=\"\"" >> .config
          fi

          make defconfig

          # --- 关键校验：profile 必须真实存在，否则会白编 3 小时 ---
          if ! grep -q "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${PROFILE}=y" .config; then
            echo "::error::profile ${PROFILE} 在当前源码中不存在！"
            echo "---- 源码里实际提供的 AX6000 相关 profile ----"
            # 注意：-mtkuboot 定义在 filogic-ext.mk（不是 filogic.mk），两个都要查
            grep -rhoE 'DEVICE_xiaomi_redmi-router-ax6000[a-z0-9_-]*' \
                 target/linux/mediatek/image/filogic.mk \
                 target/linux/mediatek/image/filogic-ext.mk 2>/dev/null | sort -u || true
            echo "---- 源码里所有 xiaomi 设备 ----"
            grep -rhoE 'DEVICE_xiaomi_[a-z0-9_-]+' \
                 target/linux/mediatek/image/filogic.mk \
                 target/linux/mediatek/image/filogic-ext.mk 2>/dev/null | sort -u || true
            exit 1
          fi
          echo "✅ profile ${PROFILE} 已启用"

      # ------------------------------------------------------------------
      # 6. 定制脚本 part2（eBPF 内核选项注入等）+ 自定义文件覆盖层
      # ------------------------------------------------------------------
      - name: 定制脚本 part2（内核 eBPF / 品牌 / 文件覆盖层）
        run: |
          cd "$SOURCE_DIR"
          chmod +x ../builder/scripts/*.sh
          # 该脚本内部会：注入内核符号 → 加候选包 → make defconfig（两轮）
          #                → 回读 .config 自检 eBPF 开关，不通过直接 fail
          bash ../builder/scripts/diy-part2.sh

          # ----------------------------------------------------------------
          # 自定义文件覆盖层 —— 目标目录必须是 $(TOPDIR)/files
          #
          # ⚠️ 这里曾经写的是 `cp -rf ../builder/files/* .`，是**错的**：
          #    `files/*` 只展开出 `files/etc` 一个条目，而 `cp -r <目录> .`
          #    是把该目录整体复制进 `.`，结果落到 `./etc/…`，永远不进固件。
          #    OpenWrt 只认 $(TOPDIR)/files：
          #      include/image.mk : $(call prepare_rootfs,$(TARGET_DIR),$(TOPDIR)/files)
          #      package/Makefile : $(call prepare_rootfs,$(TARGET_DIR),$(TOPDIR)/files)
          #    所以必须先把内容放进 `./files/`，再做逐个文件的到位校验。
          #    （旧写法下 `99-ax6000-custom` 从未进入固件，且因为
          #      `chmod … || true` 而完全静默 —— 见 README 变更记录）
          # ----------------------------------------------------------------
          if [ -d ../builder/files ]; then
            mkdir -p files
            cp -a ../builder/files/. files/

            echo "===== 自定义覆盖层 files/ 内容 ====="
            find files -type f | sort

            # 逐个核对源文件都到位；缺一个就 fail，不再静默放过
            MISSING_OVERLAY=0
            while IFS= read -r rel; do
              [ -n "$rel" ] || continue
              if [ ! -f "files/$rel" ]; then
                echo "::error::覆盖层缺少文件: $rel"
                MISSING_OVERLAY=1
              fi
            done < <(cd ../builder/files && find . -type f -printf '%P\n' | sort)

            if [ "$MISSING_OVERLAY" != "0" ]; then
              echo "::error::自定义覆盖层复制不完整，固件里会缺文件"
              exit 1
            fi
            echo "✅ 覆盖层文件全部就位（$(find files -type f | wc -l) 个）"

            chmod +x files/etc/uci-defaults/* 2>/dev/null || true
          else
            echo "::warning::../builder/files 不存在，跳过自定义覆盖层"
          fi

      - name: 打印最终关键配置
        run: |
          cd "$SOURCE_DIR"
          PRE="../builder-precheck.txt"
          : > "$PRE"
          # 本地调试时该变量不存在，兜底到 /dev/null（Actions 里一定有值）
          : "${GITHUB_STEP_SUMMARY:=/dev/null}"

          log() { echo "$@" | tee -a "$PRE"; }

          log "===== 设备 / 镜像 ====="
          grep -E '^CONFIG_TARGET_(MULTI_PROFILE|PER_DEVICE_ROOTFS|ROOTFS_SQUASHFS)|^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_' .config | tee -a "$PRE" || true

          {
            echo "## 编译前配置核对"
            echo
            echo "| 项目 | 状态 |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          log ""
          log "===== 用户要求的组件（清单由 .config 自动生成，不再手写）====="
          # 旧版这里是手写 30 多个包名的 for 循环：加插件时要记得同步两处，
          # 忘了就出现「配置里明明有、清单里却没显示」的漂移（ttyd 就是手工补的）。
          # 现在直接从 .config 提取所有 CONFIG_PACKAGE_*=y，天然不会漂移。
          #
          # 注意：这份清单只反映「用户显式写了什么」，不等于「最终进了固件」。
          # 依赖自动带入的包（如 libbpf1 ← ip-full、libwebsockets-full ← ttyd）
          # 不会出现在这里，但它们确实在固件里 —— 别看到某包不在清单就以为没装，
          # 权威判据始终是 .manifest（见后面「manifest 实测」段）。
          grep -oE '^CONFIG_PACKAGE_[^=]+' .config | sed 's/^CONFIG_PACKAGE_//' | sort > /tmp/want.txt
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            log "  [y] $p"
            echo "| \`$p\` | 已启用 |" >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/want.txt
          log "  ---- 共 $(wc -l < /tmp/want.txt) 个包被显式选中（不含依赖自动带入）----"

          log ""
          log "===== 故意不编入（用户刷机后自行安装官方版本）====="
          # momo 也一起查：momo 是 sing-box 的 LuCI 面板，与 sing-box 同属
          # 「用户自装」策略，写在这里防止哪天手滑加进 .config。
          for p in sing-box luci-app-homeproxy luci-i18n-homeproxy-zh-cn \
                   momo luci-app-momo luci-i18n-momo-zh-cn; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              log "  [!] $p  被编入了（预期是不选）"
              echo "| \`$p\` | ⚠️意外编入 |" >> "$GITHUB_STEP_SUMMARY"
            else
              log "  [OK] $p 未编入（符合预期，用户自装官方 1.14.3）"
              echo "| \`$p\` | 按预期未编入 |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          log ""
          log "===== 内核 eBPF 开关（OpenWrt 侧）====="
          # 注意：DEBUG_INFO_REDUCED 期望是「未启用」，显示「未启用」即正确
          for s in DEBUG_INFO DEBUG_INFO_BTF DEBUG_INFO_REDUCED BPF_EVENTS CGROUP_BPF XDP_SOCKETS KPROBES KALLSYMS; do
            if grep -q "^CONFIG_KERNEL_${s}=y" .config; then
              log "  [y] CONFIG_KERNEL_${s}"
              echo "| \`KERNEL_${s}\` | 已启用 |" >> "$GITHUB_STEP_SUMMARY"
            else
              log "  [ ] CONFIG_KERNEL_${s}"
              echo "| \`KERNEL_${s}\` | 未启用 |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          log "  ---- pahole 工具（BTF 生成必需，由 KERNEL_DEBUG_INFO_BTF select）----"
          DWARVES_LINE="$(grep -E '^CONFIG_DWARVES=' .config || true)"
          log "  ${DWARVES_LINE:-（未在 .config 中显式出现，属正常）}"
          echo "| \`DWARVES\`(pahole) | ${DWARVES_LINE:-由 select 自动开启} |" >> "$GITHUB_STEP_SUMMARY"

          log ""
          log "===== 选中包总数 ====="
          grep -cE '^CONFIG_PACKAGE_.*=y' .config | tee -a "$PRE"

          log ""
          log "===== 注入到 target 内核 config 的符号 ====="
          tail -30 target/linux/mediatek/filogic/config-* | tee -a "$PRE"

          echo "PRECHECK_FILE=$PRE" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 7. 预下载 + 编译
      # ------------------------------------------------------------------
      - name: 预下载源码包
        run: |
          cd "$SOURCE_DIR"
          make -j8 download V=s || echo "::warning::部分源码包下载失败，编译阶段会自动重试"

      - name: 编译固件
        run: |
          cd "$SOURCE_DIR"
          JOBS="${{ github.event.inputs.make_jobs }}"
          if [ -z "$JOBS" ]; then JOBS="$(nproc)"; fi
          echo "并行度: $JOBS"
          date
          make -j"$JOBS"
          date

      - name: 编译失败时输出错误日志
        if: failure()
        run: |
          cd "$SOURCE_DIR" || true
          echo "===== logs/ 最近的日志文件 ====="
          ls -lt logs/ 2>/dev/null | head -20 || true
          echo "===== 报错片段 ====="
          grep -rn -i -E "error:|Error [0-9]+|\*\*\* \[" logs/ 2>/dev/null | tail -80 || true

      # ------------------------------------------------------------------
      # 8. 校验内核 eBPF 是否真的打开（.config 里写了不等于编译进内核）
      # ------------------------------------------------------------------
      - name: 校验内核 eBPF / BTF 实际状态
        run: |
          cd "$SOURCE_DIR"

          # 上一轮这里写的是 `ls build_dir/target-*/linux-*/.config`，
          # 少了一层 linux-<版本> 目录（内核 .config 在 $(LINUX_DIR)/.config），
          # 导致路径取空、校验静默失效并打印假告警。改用内容 + 多路径探测。
          if KCFG="$(bash ../builder/scripts/find-kernel-config.sh)"; then
            echo "内核配置文件: $KCFG"
          else
            echo "::error::未能定位内核 .config，无法校验 eBPF 是否真的编入"
            echo "---- build_dir 结构（前 3 层）----"
            find build_dir -maxdepth 3 -type d 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "KERNEL_CONFIG_FILE=$KCFG" >> "$GITHUB_ENV"

          echo "===== 内核里 eBPF / BTF 的真实状态 ====="
          grep -E '^#? ?CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_EVENTS|CGROUP_BPF|NET_CLS_BPF|NET_ACT_BPF|XDP_SOCKETS|XDP_SOCKETS_DIAG|DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_REDUCED|KPROBES|KPROBE_EVENTS|IKCONFIG)' "$KCFG" || true

          echo
          if grep -q '^CONFIG_DEBUG_INFO_BTF=y' "$KCFG"; then
            echo "✅ BTF 已编译进内核（eBPF CO-RE 可用）"
            echo "BTF_OK=yes" >> "$GITHUB_ENV"
            echo "- 内核 BTF：✅ 已生效" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::内核 .config 里没有 CONFIG_DEBUG_INFO_BTF=y —— eBPF CO-RE 不可用"
            echo "  排查顺序：① 内核 .config 里 DEBUG_INFO_REDUCED 是否被置回 y"
            echo "            ② CONFIG_DWARVES/pahole 是否可用"
            echo "BTF_OK=no" >> "$GITHUB_ENV"
            echo "- 内核 BTF：⚠️ 未生效（详见 kernel-config 产物）" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ------------------------------------------------------------------
      # 9. 整理产物 + 上传 + 发布 Release
      # ------------------------------------------------------------------
      - name: 整理产物
        id: prep
        run: |
          cd "$SOURCE_DIR"
          DATE="$(date +%Y%m%d)"
          OUT="../out/${DATE}-${SOURCE_COMMIT_SHORT}-${PROFILE}"
          mkdir -p "$OUT"
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.ubi' -o -name '*.fip' \
               -o -name 'sha256sums' -o -name 'profiles.json' -o -name '*.manifest' \) \
            -exec cp -v {} "$OUT/" \;

          # ---- 把「证据」一并导出，以后不需要读 Actions 日志 ----
          # 1) 内核 .config 全文：eBPF/BTF 是否真编入的最终证据
          KCFG="${KERNEL_CONFIG_FILE:-}"
          if [ -n "$KCFG" ] && [ -f "$KCFG" ]; then
            cp "$KCFG" "$OUT/kernel-config.txt"
          else
            echo "内核 .config 路径未知" > "$OUT/kernel-config.txt"
          fi
          # 2) 编译前的配置核对结果
          if [ -n "${PRECHECK_FILE:-}" ] && [ -f "$PRECHECK_FILE" ]; then
            cp "$PRECHECK_FILE" "$OUT/precheck.txt"
          fi

          # 先判定 BTF 结论（用于 Release 说明；不再硬编码宣称）
          BTF_NOTE="❓ 未能定位内核 .config，BTF 状态未知，请查看 kernel-config.txt"
          BTF_VERDICT="结论: ❓ 无法判定"
          if [ -n "$KCFG" ] && [ -f "$KCFG" ]; then
            if grep -q '^CONFIG_DEBUG_INFO_BTF=y' "$KCFG"; then
              BTF_NOTE="内核已启用 eBPF / BTF（CONFIG_DEBUG_INFO_BTF=y），CORE 程序可直接运行"
              BTF_VERDICT="结论: ✅ BTF 已编入内核，eBPF CO-RE 可用"
            else
              BTF_NOTE="⚠️ 本次内核**未**启用 BTF（CONFIG_DEBUG_INFO_BTF 未生效），eBPF CO-RE 不可用"
              BTF_VERDICT="结论: ❌ 内核缺少 CONFIG_DEBUG_INFO_BTF=y，eBPF CO-RE 不可用"
            fi
          fi

          {
            echo "构建时间    : $(date '+%F %T %Z')"
            echo "源码仓库    : ${{ github.event.inputs.source_repo || 'chasey-dev/immortalwrt-mt798x-rebase' }}"
            echo "源码分支    : ${{ github.event.inputs.source_ref || '25.12' }}"
            echo "源码 commit : ${SOURCE_COMMIT}"
            echo "设备 profile: ${PROFILE}"
            echo "内核 config : ${KCFG:-（未找到）}"
            echo
            echo "===== 内核 eBPF / BTF 实际状态（最终证据）====="
            if [ -n "$KCFG" ] && [ -f "$KCFG" ]; then
              grep -E '^#? ?CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_EVENTS|CGROUP_BPF|NET_CLS_BPF|NET_ACT_BPF|XDP_SOCKETS|XDP_SOCKETS_DIAG|DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_REDUCED|KPROBES|KPROBE_EVENTS|IKCONFIG)' "$KCFG" || true
            fi
            echo
            echo "$BTF_VERDICT"
            echo
            echo "===== 编译前配置核对（节选）====="
            if [ -n "${PRECHECK_FILE:-}" ] && [ -f "$PRECHECK_FILE" ]; then
              grep -E '^\[|^  \[y\]|^  \[ \]|^CONFIG_PACKAGE_|^CONFIG_KERNEL_|^  ----|^=====' "$PRECHECK_FILE" || cat "$PRECHECK_FILE"
            fi
            echo
            echo "===== manifest 实测（固件里到底有什么，权威判据）====="
            # precheck 只反映「.config 里写了什么」，而且对依赖自动带入的包
            # 会误报（libbpf1 ← ip-full 就被误报过一次）。manifest 是 OpenWrt
            # 打包时生成的最终清单，才是「固件里真有什么」的唯一权威证据。
            MAN="$(find bin/targets -name '*.manifest' -newer "$KCFG" 2>/dev/null | head -1)"
            [ -n "$MAN" ] || MAN="$(find bin/targets -name '*.manifest' 2>/dev/null | head -1)"
            if [ -n "$MAN" ]; then
              echo "manifest 路径: $MAN"
              echo "包总数: $(wc -l < "$MAN")"
              echo
              echo "---- 核心能力实测 ----"
              # 这些是「配置里写了 → 必须真的在 manifest 里」的项；
              # 缺任何一个都说明有东西被静默丢弃了。
              for p in ttyd luci-app-ttyd luci-i18n-ttyd-zh-cn \
                       kmod-mt_wifi kmod-warp kmod-mediatek_hnat \
                       kmod-sched-bpf kmod-xdp-sockets-diag bpftool-minimal libbpf1 \
                       kmod-wireguard wireguard-tools luci-proto-wireguard \
                       kmod-nft-queue kmod-nfnetlink-queue kmod-netlink-diag \
                       ip-full kmod-dummy kmod-nft-socket \
                       miniupnpd-nftables luci-app-upnp \
                       ddns-go luci-app-ddns-go luci-i18n-ddns-go-zh-cn \
                       msd_lite luci-app-msd_lite luci-i18n-msd_lite-zh-cn \
                       vlmcsd luci-app-vlmcsd luci-i18n-vlmcsd-zh-cn \
                       luci-app-eqos-mtk luci-app-turboacc-mtk \
                       luci-app-mtwifi-cfg luci-theme-argon; do
                # manifest 格式是「包名 - 版本」，用前缀 + 分隔符精确匹配，
                # 避免 luci-app-ttyd 命中 luci-app-ttyd-something 之类
                if grep -qE "^${p} - " "$MAN"; then
                  echo "  [y] $p"
                else
                  echo "  [ ] $p  ← 未进固件（依赖未满足或包名已变，需排查）"
                fi
              done
              echo
              echo "---- 应排除项实测（出现即异常）----"
              for p in sing-box luci-app-homeproxy momo luci-app-momo \
                       smartdns luci-app-smartdns ip-tiny sqm-scripts nlbwmon; do
                if grep -qE "^${p} - " "$MAN"; then
                  echo "  [!] $p  ← 意外进固件了（预期是不选）"
                else
                  echo "  [OK] $p 未进固件（符合预期）"
                fi
              done
              echo
              echo "---- LuCI 图形插件清单（manifest 中的 luci-app-*）----"
              grep -E '^luci-app-[^ ]+ - ' "$MAN" | sed 's/ - .*//' | sort || true
            else
              echo "⚠️ 未找到 .manifest，跳过实测"
            fi
            echo
            echo "===== 产物清单 ====="
            ls -lh "$OUT" | grep -v -- 'build-info.txt' || true
          } > "$OUT/build-info.txt"

          # 校验段最后追加，并排除 build-info.txt 自身
          # （原版把 sha256sum * 写在同一个 {} 里，导致 build-info.txt 的哈希
          #   是「写到一半」的状态，永远校验不通过）
          {
            echo
            echo "===== 完整性校验（不含 build-info.txt 自身）====="
            ( cd "$OUT" && find . -maxdepth 1 -type f ! -name 'build-info.txt' -printf '%f\n' \
                | sort | xargs sha256sum )
          } >> "$OUT/build-info.txt"

          cat "$OUT/build-info.txt"
          echo "OUT_DIR=$OUT" >> "$GITHUB_ENV"
          # 用 step 输出而不是 env，保证后续 with:/body: 里一定能取到值
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          # tag 必须带 run_number：否则「同一天 + 同一个上游 commit 编两次」
          # 会得到同一个 tag，action-gh-release 会去【更新】已存在的 Release，
          # 把上一版固件覆盖掉（第三次和第五次编译都撞过：都产出了
          # ax6000-20261010-ae65e1d，后一次盖掉了前一次）。
          # run_number 单调递增，一劳永逸。
          echo "tag=ax6000-${DATE}-${SOURCE_COMMIT_SHORT}-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "commit=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "commit_short=${SOURCE_COMMIT_SHORT}" >> "$GITHUB_OUTPUT"
          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"
          echo "source_repo=${{ github.event.inputs.source_repo || 'chasey-dev/immortalwrt-mt798x-rebase' }}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${{ github.event.inputs.source_ref || '25.12' }}" >> "$GITHUB_OUTPUT"
          echo "btf_note=${BTF_NOTE}" >> "$GITHUB_OUTPUT"

          # 「预装」清单改为从 manifest 实测生成 —— 原来这里是硬编码的，
          # 里面写着 smartdns，而 smartdns 早在第 6 版就按要求移除了，
          # 等于每次发版都在 Release 页面上写一句假话。
          PKG_NOTE="（未取得 manifest，详见附件 build-info.txt 的「manifest 实测」段）"
          if [ -n "${MAN:-}" ] && [ -f "$MAN" ]; then
            PKG_NOTE="$(mktemp)"
            {
              # 只列「用户能感知到的东西」，内核模块和库不算
              for p in ttyd luci-app-ttyd kmod-wireguard wireguard-tools \
                       ddns-go msd_lite vlmcsd miniupnpd-nftables \
                       luci-app-eqos-mtk luci-app-turboacc-mtk luci-app-mtwifi-cfg; do
                grep -qE "^${p} - " "$MAN" && printf '%s ' "$p"
              done
              echo
            } | sed 's/ $//' > "$PKG_NOTE"
            PKG_TOTAL="$(wc -l < "$MAN")"
            PKG_NOTE="${PKG_NOTE:-（manifest 中未找到预期包）}"
            echo "pkg_note=$(cat "$PKG_NOTE")" >> "$GITHUB_OUTPUT"
            echo "pkg_total=${PKG_TOTAL}" >> "$GITHUB_OUTPUT"
            echo "MANIFEST_PATH=$MAN" >> "$GITHUB_OUTPUT"
          else
            echo "pkg_note=${PKG_NOTE}" >> "$GITHUB_OUTPUT"
            echo "pkg_total=unknown" >> "$GITHUB_OUTPUT"
          fi
          du -sh "$OUT"

      - name: 上传固件为 artifact
        uses: actions/upload-artifact@v6
        with:
          name: ax6000-${{ steps.prep.outputs.date }}-${{ steps.prep.outputs.profile }}
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: 发布 Release
        # v2 是最终主版本（Node 20）；已钉死，避免上游主线漂移导致发布行为变化。
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "Redmi AX6000 ${{ steps.prep.outputs.date }} (${{ steps.prep.outputs.profile }})"
          files: out/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Redmi AX6000 自编译固件

            | 项目 | 内容 |
            | --- | --- |
            | 源码 | `${{ steps.prep.outputs.source_repo }}` @ `${{ steps.prep.outputs.source_ref }}` |
            | 源码 commit | `${{ steps.prep.outputs.commit }}` |
            | 设备 profile | `${{ steps.prep.outputs.profile }}` |
            | 构建时间 | `${{ steps.prep.outputs.date }}` |

            **内核状态**：${{ steps.prep.outputs.btf_note }}

            **固件包总数**：${{ steps.prep.outputs.pkg_total }}（来自 `.manifest` 实测，非配置推断）

            预装（`.manifest` 实测确认）：MTK 原厂闭源 WiFi 驱动（`kmod-mt_wifi` 7.6.7.3）、
            HNAT/WARP 硬件加速（`kmod-mediatek_hnat` / `kmod-warp`）、eBPF/BTF、
            ${{ steps.prep.outputs.pkg_note }}

            > 说明：`sing-box` / `momo` / `homeproxy` **按需不预装** —— 固件已预置它们的
            > 全部内核模块依赖（`kmod-nft-queue` / `kmod-nfnetlink-queue` / `kmod-netlink-diag` /
            > `ip-full` / `kmod-dummy`），刷机后自行安装官方版本即可。
            > `smartdns` 也已按要求移除，DNS 走 `dnsmasq-full`。

            📎 附件里的 `build-info.txt` / `kernel-config.txt` / `precheck.txt`
            是本次构建的完整证据（内核实测配置、manifest 实测清单、编译前核对结果）。
            `build-info.txt` 里有「manifest 实测」段，逐项列出每个核心包是否真的进了固件。

            > ⚠️ 刷机有变砖风险。请务必刷与路由器当前 U-Boot 布局一致的镜像，
            > 首次刷机前建议备份原厂分区。详细步骤见仓库 README。
